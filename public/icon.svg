<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App background -->
  <rect width="512" height="512" rx="114" fill="#e55a4a"/>

  <!-- Nut (thick top bar) -->
  <rect x="134" y="88" width="244" height="18" rx="9" fill="white"/>

  <!-- 4 strings (vertical) -->
  <line x1="148" y1="88"  x2="148" y2="424" stroke="white" stroke-width="7" stroke-opacity="0.65" stroke-linecap="round"/>
  <line x1="220" y1="88"  x2="220" y2="424" stroke="white" stroke-width="7" stroke-opacity="0.65" stroke-linecap="round"/>
  <line x1="292" y1="88"  x2="292" y2="424" stroke="white" stroke-width="7" stroke-opacity="0.65" stroke-linecap="round"/>
  <line x1="364" y1="88"  x2="364" y2="424" stroke="white" stroke-width="7" stroke-opacity="0.65" stroke-linecap="round"/>

  <!-- Fret lines -->
  <line x1="134" y1="172" x2="378" y2="172" stroke="white" stroke-width="5" stroke-opacity="0.40" stroke-linecap="round"/>
  <line x1="134" y1="256" x2="378" y2="256" stroke="white" stroke-width="5" stroke-opacity="0.40" stroke-linecap="round"/>
  <line x1="134" y1="340" x2="378" y2="340" stroke="white" stroke-width="5" stroke-opacity="0.40" stroke-linecap="round"/>
  <line x1="134" y1="424" x2="378" y2="424" stroke="white" stroke-width="5" stroke-opacity="0.40" stroke-linecap="round"/>

  <!-- Chord fingering dots -->
  <circle cx="148" cy="214" r="27" fill="white"/>
  <circle cx="292" cy="298" r="27" fill="white"/>
  <circle cx="364" cy="298" r="27" fill="white"/>
</svg>
